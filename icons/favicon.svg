<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#09131e" />
      <stop offset="100%" stop-color="#041d24" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- "A" Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- Crossbar Accent Gradient -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Drop Shadow for Letter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#0d9488" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- The "A" - Modern, Sleek, Well-Proportioned (Height 216px, from Y=148 to Y=364) -->
  <g filter="url(#shadow)">
    <!-- Main A Body (Clean Geometric Path) -->
    <path d="M 256 148 L 348 364 L 298 364 L 278 314 L 234 314 L 214 364 L 164 364 Z M 256 220 L 244 274 L 268 274 Z" 
          fill="url(#letterGrad)" />
    
    <!-- Dynamic Glowing Crossbar Accent (Subtle Financial Growth Line) -->
    <rect x="210" y="294" width="92" height="12" rx="6" fill="url(#crossbarGrad)" />

    <!-- Tiny upward spark dot above A (symbol of growth / precision) -->
    <circle cx="256" cy="130" r="5" fill="#2dd4bf" />
  </g>
</svg>
